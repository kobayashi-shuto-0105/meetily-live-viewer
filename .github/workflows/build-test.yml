name: "Build Test"

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
      - devtest
  pull_request:
    branches:
      - main
      - develop
      - devtest
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # for Apple Silicon only (M1 and above)
            args: "--target aarch64-apple-darwin"
            target: "aarch64-apple-darwin"
          - platform: "ubuntu-22.04" # Build .deb on 22.04
            args: "--bundles deb"
            target: "x86_64-unknown-linux-gnu"
          - platform: "ubuntu-24.04" # Build AppImage and RPM on 24.04
            args: "--bundles appimage,rpm"
            target: "x86_64-unknown-linux-gnu"
          - platform: "windows-latest"
            args: ""
            target: "x86_64-pc-windows-msvc"

    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      sign-binaries: true
      asset-prefix: "meetily-test"
      upload-artifacts: true
      is-debug-build: ${{ contains(matrix.args, '--debug') }}
    secrets: inherit

  build-test-macos:
    if: ${{ github.event_name != 'workflow_dispatch' }}
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      platform: "macos-latest"
      target: "aarch64-apple-darwin"
      build-args: --target aarch64-apple-darwin --config '{"bundle":{"createUpdaterArtifacts":false}}'
      sign-binaries: false
      asset-prefix: "meetily-test"
      upload-artifacts: false
      is-debug-build: false
    secrets: inherit
