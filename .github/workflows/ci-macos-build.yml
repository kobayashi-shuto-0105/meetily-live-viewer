# =============================================================================
# macOS ビルドチェック CI
# =============================================================================
# 目的:
#   PR や push 時に macOS (Apple Silicon) 環境での Rust コンパイルと
#   フロントエンドのビルドが通ることを自動検証する。
#   フルバンドルビルド（DMG/App 生成）は行わず、コンパイルエラーの早期検出に特化。
#
# トリガー:
#   - develop / main ブランチへの push
#   - develop / main ブランチへの PR（opened / synchronize / reopened）
#   - 手動実行（workflow_dispatch）
#
# 既存ワークフローとの違い:
#   - build-macos.yml / build-test.yml: 手動トリガーのみ、フルビルド＋署名＋成果物生成
#   - 本ワークフロー: 自動トリガー、cargo check + フロントエンドビルドのみ（軽量・高速）
# =============================================================================

name: "CI: macOS Build Check"

# -----------------------------------------------------------------------------
# トリガー設定
# develop / main への push と PR で自動実行。手動実行も可能。
# -----------------------------------------------------------------------------
on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
    # PR が開かれた時、更新された時、再オープンされた時に実行
    types: [opened, synchronize, reopened]
  # 手動実行にも対応（デバッグ用途）
  workflow_dispatch:

# -----------------------------------------------------------------------------
# 同一ブランチで複数回 push された場合、古い実行をキャンセルして最新のみ実行する
# （CI リソースの無駄遣いを防ぐ）
# -----------------------------------------------------------------------------
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# -----------------------------------------------------------------------------
# 全ジョブ共通の環境変数
# -----------------------------------------------------------------------------
env:
  # Rust のパニック時にバックトレースを表示（デバッグ用）
  RUST_BACKTRACE: 1
  # cargo の出力に色を付ける
  CARGO_TERM_COLOR: always

jobs:
  # ===========================================================================
  # ジョブ 1: Rust コンパイルチェック（cargo check）
  # ===========================================================================
  # cargo check は cargo build と違いバイナリを生成せず、型チェックと
  # 借用チェックのみを行うため高速。コンパイルエラーの早期検出に最適。
  # ===========================================================================
  rust-check:
    name: "Rust: cargo check (macOS)"
    runs-on: macos-latest  # Apple Silicon (M1+) ランナー

    steps:
      # -----------------------------------------------------------------------
      # 1. リポジトリのチェックアウト
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. Rust ツールチェインのセットアップ
      # macOS ランナーは Apple Silicon (aarch64) なので、対応するターゲットを指定
      # -----------------------------------------------------------------------
      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      # -----------------------------------------------------------------------
      # 3. Rust のビルドキャッシュ
      # 依存クレートのコンパイル結果をキャッシュし、2 回目以降の実行を高速化する
      # -----------------------------------------------------------------------
      - name: Restore Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          # ワークスペースルートの Cargo.toml → target ディレクトリのマッピング
          workspaces: ". -> target"
          key: ci-macos-check

      # -----------------------------------------------------------------------
      # 4. ワークスペース全体の cargo check
      # Cargo.toml の [workspace] に含まれる全クレート
      # （frontend/src-tauri + llama-helper）をチェックする。
      # --target を指定して macOS 向けの条件コンパイル（cfg(target_os = "macos")）
      # が正しく通ることを確認する。
      # -----------------------------------------------------------------------
      - name: "cargo check: compile-check entire workspace"
        run: |
          echo "=== ワークスペース全体の cargo check を実行 ==="
          echo "Target: aarch64-apple-darwin (Apple Silicon)"
          cargo check --workspace --target aarch64-apple-darwin
          echo "✅ cargo check passed"

  # ===========================================================================
  # ジョブ 2: フロントエンドのビルドチェック
  # ===========================================================================
  # Next.js のビルド（pnpm build）と TypeScript の型チェックを行う。
  # Tauri のフルビルドは行わず、Web 側のコンパイルエラーのみを検出する。
  # ===========================================================================
  frontend-check:
    name: "Frontend: build + lint (macOS)"
    runs-on: macos-latest  # Apple Silicon (M1+) ランナー

    steps:
      # -----------------------------------------------------------------------
      # 1. リポジトリのチェックアウト
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. pnpm のセットアップ
      # このリポジトリは pnpm をパッケージマネージャーとして使用している
      # -----------------------------------------------------------------------
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8
          run_install: false

      # -----------------------------------------------------------------------
      # 3. Node.js のセットアップ
      # Next.js 14 は Node.js 18+ が必要。20 を使用。
      # -----------------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # -----------------------------------------------------------------------
      # 4. pnpm ストアのキャッシュ
      # node_modules の再インストールを避けるため、pnpm のグローバルストアをキャッシュ
      # -----------------------------------------------------------------------
      - name: Get pnpm store path
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Restore pnpm store cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # -----------------------------------------------------------------------
      # 5. フロントエンド依存パッケージのインストール
      # -----------------------------------------------------------------------
      - name: Install frontend dependencies
        run: |
          cd frontend
          pnpm install
          echo "✅ pnpm install complete"

      # -----------------------------------------------------------------------
      # 6. Next.js ビルド
      # TypeScript のコンパイルと Next.js のページ生成を実行。
      # ビルドエラーがあればここで検出される。
      # -----------------------------------------------------------------------
      - name: "Build Next.js (TypeScript compile + page generation)"
        run: |
          cd frontend
          echo "=== Running Next.js build ==="
          pnpm build
          echo "✅ Next.js build passed"

      # -----------------------------------------------------------------------
      # 7. ESLint によるコード品質チェック
      # Next.js の lint 設定（eslint.config.mjs）に基づいてチェックを実行。
      # -----------------------------------------------------------------------
      - name: "Run ESLint"
        run: |
          cd frontend
          echo "=== Running ESLint ==="
          pnpm lint
          echo "✅ ESLint passed"
